name: Vertical (capturas)

# Compila StradaOS Prueba y saca capturas del inicio en pantallas verticales (estilo Tesla).
# Las capturas quedan como artefacto y en la rama «vertical-capturas».
on:
  push:
    branches: [ main ]
    paths: [ 'app/**', '.github/workflows/vertical.yml', '.github/scripts/vertical.sh' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vertical
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/*.apk prueba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: prueba.apk

  emulador:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        size: [ '768x1024', '720x1280' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin ${{ matrix.size }}
          emulator-boot-timeout: 900
          script: bash .github/scripts/vertical.sh ${{ matrix.size }} capturas/${{ matrix.size }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vertical-${{ matrix.size }}
          path: capturas/

  publicar:
    needs: emulador
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vertical-*
          path: out
          merge-multiple: true
      - name: Subir capturas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b vertical-capturas
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "Capturas verticales (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" vertical-capturas
